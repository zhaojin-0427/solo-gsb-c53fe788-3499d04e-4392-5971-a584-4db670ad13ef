<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webhook 故障演练与回放台</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand">🪝 Webhook 故障演练与回放台</div>
  <div class="top-status">
    <span id="sse-dot" class="dot" title="SSE 连接状态"></span>
    <span id="sse-text">连接中…</span>
  </div>
</header>

<main class="layout">
  <!-- ================= scenarios sidebar ================= -->
  <aside class="pane pane-scenarios">
    <div class="pane-head">
      <h2>场景</h2>
      <button class="btn btn-sm" id="btn-new-scenario">+ 新建场景</button>
    </div>
    <div id="scenario-list" class="list"></div>
  </aside>

  <!-- ================= center: editor + deliveries ================= -->
  <section class="pane pane-center">
    <div id="scenario-editor" class="card hidden">
      <div class="card-head">
        <h2 id="se-title">场景</h2>
        <div class="row-gap">
          <button class="btn btn-sm" id="btn-save-scenario">保存</button>
          <button class="btn btn-sm danger" id="btn-delete-scenario">删除</button>
        </div>
      </div>
      <div class="form-grid">
        <label>名称<input id="f-name"></label>
        <label>目标 URL<input id="f-url" placeholder="http://localhost:8000/hooks/{id}"></label>
        <label>签名密钥 (HMAC-SHA256)<input id="f-secret" placeholder="留空表示不校验"></label>
        <label class="col2">请求体 (JSON)
          <textarea id="f-body" rows="5" spellcheck="false">{}</textarea>
        </label>

        <fieldset class="col2">
          <legend>退避策略</legend>
          <div class="form-grid">
            <label>类型
              <select id="f-bo-kind">
                <option value="fixed">fixed（固定）</option>
                <option value="linear">linear（线性）</option>
                <option value="exponential" selected>exponential（指数）</option>
              </select>
            </label>
            <label>基础延迟 ms<input id="f-bo-base" type="number" min="0"></label>
            <label>倍率 (≥1)<input id="f-bo-factor" type="number" step="0.5" min="1"></label>
            <label>上限 ms<input id="f-bo-cap" type="number" min="0"></label>
            <label>抖动
              <select id="f-bo-jitter">
                <option value="none">none（无）</option>
                <option value="full">full（确定性全抖动）</option>
              </select>
            </label>
            <label>最大尝试次数<input id="f-max" type="number" min="1" max="100"></label>
          </div>
        </fieldset>

        <fieldset class="col2">
          <legend>按尝试次数触发的故障规则（0 = 默认兜底）</legend>
          <table class="rules-table">
            <thead><tr><th>尝试 #</th><th>动作</th><th>状态码</th><th>说明</th><th></th></tr></thead>
            <tbody id="f-rules-body"></tbody>
          </table>
          <button class="btn btn-sm" id="btn-add-rule" type="button">+ 添加规则</button>
        </fieldset>
      </div>
    </div>

    <div class="card" id="deliveries-card">
      <div class="card-head">
        <h2>投递</h2>
        <div class="row-gap" id="delivery-actions">
          <button class="btn btn-sm" id="btn-new-delivery">▶ 发起投递</button>
          <button class="btn btn-sm" id="btn-new-delivery-paused">⏸ 发起（暂停）</button>
        </div>
      </div>
      <div id="delivery-list" class="delivery-list">
        <p class="muted">请先在左侧选择或创建一个场景。</p>
      </div>
    </div>
  </section>

  <!-- ================= right: detail / compare ================= -->
  <section class="pane pane-detail">
    <div class="pane-head">
      <h2>分支与时间线</h2>
      <div class="row-gap">
        <select id="compare-b-select" class="hidden"></select>
        <button class="btn btn-sm hidden" id="btn-clear-compare">关闭对比</button>
      </div>
    </div>
    <div id="detail-body"><p class="muted">选择一次投递查看尝试、虚拟时钟与分叉。</p></div>
  </section>
</main>

<!-- ================= inbox drawer ================= -->
<div id="inbox-drawer" class="drawer">
  <div class="drawer-head">
    <h3>接收端收件箱（幂等去重日志）</h3>
    <button class="btn btn-sm" id="btn-close-inbox">收起</button>
  </div>
  <div id="inbox-body"></div>
</div>
<button id="btn-open-inbox" class="floating-btn">收件箱</button>

<!-- ================= fork modal ================= -->
<div id="modal-mask" class="modal-mask hidden">
  <div class="modal">
    <h3 id="fork-title">在此检查点分叉</h3>
    <p class="muted" id="fork-hint"></p>
    <label>分支标签 <input id="fk-label" placeholder="例如：把 503 改成 200"></label>
    <label>检查点：在第 <b id="fk-cp-text"></b> 次尝试之后分叉</label>
    <fieldset>
      <legend>故障规则覆盖（留空 = 沿用父分支）</legend>
      <table class="rules-table">
        <thead><tr><th>尝试 #</th><th>动作</th><th>状态码</th><th>说明</th><th></th></tr></thead>
        <tbody id="fk-rules-body"></tbody>
      </table>
      <button class="btn btn-sm" id="btn-fk-add-rule" type="button">+ 添加规则</button>
    </fieldset>
    <div class="form-grid">
      <label>退避类型
        <select id="fk-bo-kind">
          <option value="">（沿用）</option>
          <option value="fixed">fixed</option>
          <option value="linear">linear</option>
          <option value="exponential">exponential</option>
        </select>
      </label>
      <label>基础延迟 ms<input id="fk-bo-base" type="number" min="0" placeholder="（沿用）"></label>
      <label>倍率<input id="fk-bo-factor" type="number" step="0.5" min="1" placeholder="（沿用）"></label>
      <label>上限 ms<input id="fk-bo-cap" type="number" min="0" placeholder="（沿用）"></label>
      <label>抖动
        <select id="fk-bo-jitter">
          <option value="">（沿用）</option>
          <option value="none">none</option>
          <option value="full">full</option>
        </select>
      </label>
      <label>最大尝试次数<input id="fk-max" type="number" min="1" max="100" placeholder="（沿用）"></label>
      <label>时钟速度
        <select id="fk-speed">
          <option value="">（沿用）</option>
          <option value="1">1×</option>
          <option value="10" selected>10×</option>
          <option value="60">60×</option>
          <option value="600">600×</option>
        </select>
      </label>
      <label class="check"><input id="fk-paused" type="checkbox"> 以暂停状态创建</label>
    </div>
    <div class="modal-actions">
      <button class="btn" id="btn-fk-cancel">取消</button>
      <button class="btn primary" id="btn-fk-confirm">创建分叉</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
